    <style>
      /* Floating BGM Controller */
      .bgm-floating-btn {
        position: fixed;
        bottom: 24px;
        right: 20px;
        z-index: 9999;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(12, 10, 36, 0.85);
        border: 1px solid rgba(226, 200, 143, 0.45);
        color: #f6e2ae;
        padding: 9px 16px;
        border-radius: 9999px;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        cursor: pointer;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 16px rgba(226, 200, 143, 0.2);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .bgm-floating-btn:hover {
        background: rgba(23, 20, 60, 0.95);
        border-color: rgba(226, 200, 143, 0.8);
        transform: translateY(-2px);
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6), 0 0 20px rgba(226, 200, 143, 0.35);
      }
      .bgm-floating-btn:active {
        transform: scale(0.96);
      }
      .bgm-icon-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
      }
      .sound-waves {
        display: flex;
        align-items: flex-end;
        gap: 2.5px;
        height: 14px;
      }
      .sound-wave-bar {
        width: 2.5px;
        height: 100%;
        background: linear-gradient(180deg, #e2c88f, #eeb2c0);
        border-radius: 1px;
        animation: wave-bar 1.2s ease-in-out infinite alternate;
      }
      .sound-wave-bar:nth-child(1) { animation-delay: 0.0s; height: 40%; }
      .sound-wave-bar:nth-child(2) { animation-delay: 0.2s; height: 90%; }
      .sound-wave-bar:nth-child(3) { animation-delay: 0.4s; height: 60%; }
      .sound-wave-bar:nth-child(4) { animation-delay: 0.1s; height: 100%; }

      .bgm-floating-btn.is-paused .sound-wave-bar {
        animation-play-state: paused;
        height: 25% !important;
        opacity: 0.45;
      }
      @keyframes wave-bar {
        0% { height: 25%; }
        100% { height: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Background Audio -->
    <audio id="weddingBgm" loop preload="auto">
      <source src="editable/assets/bgm.mp3" type="audio/mp3">
    </audio>

    <!-- Floating Audio Control -->
    <div id="bgmBtn" class="bgm-floating-btn is-paused" role="button" aria-label="Toggle Background Music" tabindex="0">
      <div class="bgm-icon-wrapper">
        <div class="sound-waves">
          <span class="sound-wave-bar"></span>
          <span class="sound-wave-bar"></span>
          <span class="sound-wave-bar"></span>
          <span class="sound-wave-bar"></span>
        </div>
      </div>
      <span id="bgmStatusText">Play Music</span>
    </div>

    <script>
      (function() {
        var bgm = document.getElementById('weddingBgm');
        var btn = document.getElementById('bgmBtn');
        var statusText = document.getElementById('bgmStatusText');

        function updateBtnState() {
          if (!bgm || !btn) return;
          if (bgm.paused) {
            btn.classList.add('is-paused');
            if (statusText) statusText.textContent = 'Play Music';
          } else {
            btn.classList.remove('is-paused');
            if (statusText) statusText.textContent = 'Music';
          }
        }

        function playBgm() {
          if (!bgm) return;
          var promise = bgm.play();
          if (promise !== undefined) {
            promise.then(function() {
              updateBtnState();
            }).catch(function() {
              updateBtnState();
            });
          }
        }

        if (btn) {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (bgm.paused) {
              playBgm();
            } else {
              bgm.pause();
              updateBtnState();
            }
          });
        }

        // Auto-play on "Open Invitation" click or any first interaction
        document.addEventListener('click', function autoPlayHandler() {
          if (bgm && bgm.paused) {
            playBgm();
          }
        }, { passive: true });

        if (bgm) {
          bgm.addEventListener('play', updateBtnState);
          bgm.addEventListener('pause', updateBtnState);
        }
      })();
    </script>
  </body>
